pipeline_id: corn-stover-bran
name: "Corn Stover & Bran (Palha/Sabugo de Milho) Diferulate Bridge -> Bio-Vanillin"
feedstock:
  type: arabinoxylan_ferulate
  composition:
    cellulose_pct: 36.0
    arabinoxylan_pct: 28.0
    lignin_ferulate_pct: 18.0
  target_bond: "Diferulate-Arabinoxylan Ester Crosslink Bridge (335 kJ/mol)"
  smiles: "COc1cc(/C=C/C(=O)OCC2OC(O)C(O)C2O)ccc1O"
  reference_analog_smiles: "COc1cc(/C=C/C(=O)O)ccc1O"
reactor:
  temperature_c: 50.0
  ph: 5.5
modules:
  module_1_anchor:
    role: "Interfacial Anchor"
    subtype: "CBM_Arabinoxylan_Anchor"
    description: "CBM13 / CBM42 Arabinoxylan-Binding Module"
  module_2_scissor:
    role: "Primary Bond Scissor"
    consortium_members:
      - name: "Feruloyl_Bridge_Scissor"
        subtype: "CE1_Feruloyl_Esterase"
      - name: "Sidechain_De_brancher"
        subtype: "GH51_Arabinofuranosidase"
  module_3_sink:
    role: "Equilibrium Sink"
    subtype: "Ferulate_Vanillin_Sink"
    sink_product: "4-Vinylguaiacol -> Bio-Vanillin (via FDC1 + VpVAN)"
  module_4_beacon:
    role: "Optical Beacon"
    subtype: "Carotenoid_Reporter"
    sensor: "FerC Ferulate-Responsive Transcriptional Repressor"
    readout: "Ferulate-Proportional Lycopene / Chromoprotein Readout"
linkers:
  - "GGGGSGGGGS"
  - "EAAAK"
hosts:
  - p_putida
  - b_subtilis
  - s_cerevisiae
