[project]
name = "teaflon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jônatas Davi Paganini", email = "jonatasdp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pgbio",
]

[project.scripts]
teaflon = "teaflon:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
pgbio = { path = "../pg_bio/pgbio-py" }
